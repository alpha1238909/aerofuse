[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerofuse"
version = "1.1.0"
description = "Offline sensor fusion and flight-event detection for student hardware."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AeroFuse contributors"}]
keywords = ["telemetry", "sensor-fusion", "esp32", "arduino", "rocketry", "drones"]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
aerofuse = "aerofuse.cli:main"

[project.optional-dependencies]
matlab = ["scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
aerofuse = ["py.typed"]
